<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My DotHabit</title>
  <meta name="theme-color" content="#09090b" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .center {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 20px; gap: 12px;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 20px 16px 80px; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; gap: 8px; flex-wrap: wrap;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .range-switch {
      display: inline-flex; background: #18181b; border: 1px solid #27272a;
      border-radius: 8px; padding: 2px;
    }
    .range-btn {
      background: transparent; border: none; color: #a1a1aa;
      padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background-color 0.15s, color 0.15s;
    }
    .range-btn.active { background: #27272a; color: #f4f4f5; }

    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 16px;
    }
    .habit-list { display: flex; flex-direction: column; gap: 16px; }
    .habit-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px;
    }
    .habit-title { font-weight: 600; font-size: 16px; margin-right: 8px; }
    .habit-count { font-size: 12px; color: #a1a1aa; }

    .dot-grid {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-auto-flow: column;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 3px; cursor: pointer;
      transition: transform 0.1s;
    }
    .dot:hover { transform: scale(1.2); }
    .dot.has-memo { outline: 1.5px solid #ffffffaa; outline-offset: -1.5px; }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: #f4f4f5; color: #09090b; border: none; border-radius: 8px;
      padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .btn-check {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1.5px solid; border-radius: 8px; padding: 6px 12px;
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-icon {
      background: transparent; border: none; color: #71717a; cursor: pointer; padding: 6px; font-size: 14px;
    }
    .btn-icon:hover { color: #f4f4f5; }

    .add-form { margin-bottom: 20px; display: none; flex-direction: column; gap: 12px; }
    .add-form.open { display: flex; }
    input[type="text"], textarea {
      width: 100%; background: #09090b; border: 1px solid #3f3f46; border-radius: 8px;
      padding: 10px 12px; color: #fff; font-size: 14px; margin-top: 4px;
    }
    .color-picker { display: flex; gap: 10px; }
    .color-dot {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    }
    .color-dot.selected { border-color: #fff; transform: scale(1.1); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal { width: 100%; max-width: 400px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="login-view" class="center">
    <h1>My DotHabit</h1>
    <p style="color:#888; margin-bottom:12px;">自分専用の習慣トラッカー</p>
    <button id="btn-login" class="btn-primary">Googleアカウントでログイン</button>
    <p id="auth-error" style="color:#ef4444; font-size:13px;"></p>
  </div>

  <div id="app-view" class="container" style="display:none;">
    <header class="header">
      <h1>My DotHabit</h1>
      <div class="header-actions">
        <div class="range-switch" role="group" aria-label="表示期間">
          <button type="button" class="range-btn" data-days="120">120日</button>
          <button type="button" class="range-btn" data-days="30">30日</button>
        </div>
        <button id="btn-toggle-add" class="btn-primary">＋ 追加</button>
        <button id="btn-logout" class="btn-icon" title="ログアウト">退出</button>
      </div>
    </header>

    <form id="add-form" class="card add-form">
      <input type="text" id="habit-title" placeholder="習慣の名前（例：読書 15分、散歩）" required />
      <div class="color-picker" id="add-color-picker"></div>
      <button type="submit" class="btn-primary" style="width:100%;">作成する</button>
    </form>

    <div id="habit-list" class="habit-list"></div>
  </div>

  <!-- 日付別記録＆メモモーダル -->
  <div id="log-modal-backdrop" class="modal-backdrop">
    <div class="card modal">
      <div class="modal-header">
        <h3 id="log-modal-title"></h3>
        <button id="btn-close-log-modal" class="btn-icon">✕</button>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="log-modal-completed" />
        <span>達成済みにする</span>
      </label>
      <div style="margin-top:12px;">
        <label style="font-size:12px; color:#a1a1aa;">一言メモ</label>
        <textarea id="log-modal-memo" rows="3" placeholder="感想や記録メモ..."></textarea>
      </div>
      <button id="btn-save-log-modal" class="btn-primary" style="width:100%; margin-top:12px;">保存</button>
    </div>
  </div>

  <!-- 習慣編集（リネーム＆色変更）モーダル -->
  <div id="edit-modal-backdrop" class="modal-backdrop">
    <div class="card modal">
      <div class="modal-header">
        <h3>習慣の編集</h3>
        <button id="btn-close-edit-modal" class="btn-icon">✕</button>
      </div>
      <div>
        <label style="font-size:12px; color:#a1a1aa;">習慣の名前</label>
        <input type="text" id="edit-habit-title" required />
      </div>
      <div style="margin-top:12px;">
        <label style="font-size:12px; color:#a1a1aa; display:block; margin-bottom:6px;">テーマカラー</label>
        <div class="color-picker" id="edit-color-picker"></div>
      </div>
      <button id="btn-save-edit-modal" class="btn-primary" style="width:100%; margin-top:14px;">変更を保存</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, setDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // ★ ここに firebaseConfig を貼り付けてください ★
const firebaseConfig = {
  apiKey: "AIzaSyB_DmTpMKMVHxNKlC5umC1hadI4EwSx1TE",
  authDomain: "my-dothabit.firebaseapp.com",
  projectId: "my-dothabit",
  storageBucket: "my-dothabit.firebasestorage.app",
  messagingSenderId: "31960931153",
  appId: "1:31960931153:web:79223d75c0cb208c1b1170",
  measurementId: "G-S413NH83FM"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    const COLORS = ['#10b981', '#3b82f6', '#8b5cf6', '#f59e0b', '#ef4444', '#ec4899'];
    const RANGE_STORAGE_KEY = 'dothabit_range_days';

    const savedRange = Number(localStorage.getItem(RANGE_STORAGE_KEY));
    let rangeDays = (savedRange === 30 || savedRange === 120) ? savedRange : 120;

    let addSelectedColor = COLORS[0];
    let editSelectedColor = COLORS[0];
    let editingHabitId = null;

    let habits = [];
    let logs = {};
    let logModalState = null;
    let unsubHabits = null;
    let unsubLogs = null;

    const getPastDays = (days) => {
      const res = [];
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        res.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
      }
      return res;
    };

    function renderColorPicker(containerEl, getCurrent, setCurrent) {
      containerEl.innerHTML = '';
      COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `color-dot ${c === getCurrent() ? 'selected' : ''}`;
        btn.style.backgroundColor = c;
        btn.onclick = () => {
          setCurrent(c);
          containerEl.querySelectorAll('.color-dot').forEach(el => el.classList.remove('selected'));
          btn.classList.add('selected');
        };
        containerEl.appendChild(btn);
      });
    }

    const addColorPickerEl = document.getElementById('add-color-picker');
    const editColorPickerEl = document.getElementById('edit-color-picker');
    renderColorPicker(addColorPickerEl, () => addSelectedColor, (c) => { addSelectedColor = c; });

    // 表示期間（120日 / 30日）切り替え
    function syncRangeButtons() {
      document.querySelectorAll('.range-btn').forEach(btn => {
        const d = Number(btn.dataset.days);
        btn.classList.toggle('active', d === rangeDays);
      });
    }
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.onclick = () => {
        rangeDays = Number(btn.dataset.days);
        localStorage.setItem(RANGE_STORAGE_KEY, String(rangeDays));
        syncRangeButtons();
        render();
      };
    });
    syncRangeButtons();

    // 認証イベント
    document.getElementById('btn-login').onclick = async () => {
      document.getElementById('auth-error').textContent = '';
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        document.getElementById('auth-error').textContent = 'ログインに失敗しました: ' + e.message;
      }
    };
    document.getElementById('btn-logout').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        startSync();
      } else {
        document.getElementById('login-view').style.display = 'flex';
        document.getElementById('app-view').style.display = 'none';
        if (unsubHabits) unsubHabits();
        if (unsubLogs) unsubLogs();
      }
    });

    function startSync() {
      const qHabits = query(collection(db, 'habits'), orderBy('createdAt', 'asc'));
      unsubHabits = onSnapshot(qHabits, (snap) => {
        habits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }, (err) => {
        alert('データ読み込みエラー（Firestoreのルールやログインアカウントを確認してください）: ' + err.message);
      });

      unsubLogs = onSnapshot(collection(db, 'logs'), (snap) => {
        logs = {};
        snap.docs.forEach(d => { logs[d.id] = d.data(); });
        render();
      });
    }

    // 習慣追加
    const addForm = document.getElementById('add-form');
    document.getElementById('btn-toggle-add').onclick = () => addForm.classList.toggle('open');
    addForm.onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('habit-title');
      const title = input.value.trim();
      if (!title) return;
      await addDoc(collection(db, 'habits'), { title, color: addSelectedColor, createdAt: Date.now() });
      input.value = '';
      addForm.classList.remove('open');
    };

    // 描画
    function render() {
      const listEl = document.getElementById('habit-list');
      listEl.innerHTML = '';

      const days = getPastDays(rangeDays);
      const today = days[days.length - 1];

      habits.forEach(habit => {
        const habitColor = habit.color || COLORS[0];
        const isTodayDone = !!logs[`${habit.id}_${today}`]?.completed;
        const totalCount = days.filter(d => logs[`${habit.id}_${d}`]?.completed).length;

        const card = document.createElement('div');
        card.className = 'card';

        const header = document.createElement('div');
        header.className = 'habit-header';
        header.innerHTML = `
          <div>
            <span class="habit-title">${escapeHtml(habit.title)}</span>
            <span class="habit-count">${totalCount}日達成（${rangeDays}日）</span>
          </div>
          <div style="display:flex; align-items:center; gap:4px;">
            <button class="btn-check" style="background:${isTodayDone ? habitColor : '#27272a'}; border-color:${habitColor}; margin-right:4px;">
              ${isTodayDone ? '✓ 完了' : '今日を記録'}
            </button>
            <button class="btn-icon btn-edit" title="名前・色を変更">✎</button>
            <button class="btn-icon btn-del" title="削除">🗑</button>
          </div>
        `;

        header.querySelector('.btn-check').onclick = async () => {
          const logId = `${habit.id}_${today}`;
          const cur = logs[logId];
          if (cur?.completed) {
            await deleteDoc(doc(db, 'logs', logId));
          } else {
            await setDoc(doc(db, 'logs', logId), { habitId: habit.id, date: today, completed: true, memo: cur?.memo || '' });
          }
        };

        header.querySelector('.btn-edit').onclick = () => openEditModal(habit);

        header.querySelector('.btn-del').onclick = async () => {
          if (confirm('この習慣を削除しますか？')) {
            await deleteDoc(doc(db, 'habits', habit.id));
          }
        };

        const grid = document.createElement('div');
        grid.className = 'dot-grid';

        days.forEach(date => {
          const log = logs[`${habit.id}_${date}`];
          const done = !!log?.completed;
          const hasMemo = !!log?.memo;
          const dot = document.createElement('div');
          dot.className = `dot ${hasMemo ? 'has-memo' : ''}`;
          dot.style.backgroundColor = done ? habitColor : '#27272a';
          dot.title = `${date}${hasMemo ? ' : ' + log.memo : ''}`;
          dot.onclick = () => openLogModal(habit, date);
          grid.appendChild(dot);
        });

        card.appendChild(header);
        card.appendChild(grid);
        listEl.appendChild(card);
      });
    }

    // 日付別記録＆メモモーダル操作
    const logBackdrop = document.getElementById('log-modal-backdrop');
    const logModalTitle = document.getElementById('log-modal-title');
    const logModalCompleted = document.getElementById('log-modal-completed');
    const logModalMemo = document.getElementById('log-modal-memo');

    function openLogModal(habit, date) {
      const log = logs[`${habit.id}_${date}`] || { completed: false, memo: '' };
      logModalState = { habitId: habit.id, date };
      logModalTitle.textContent = `${habit.title} (${date})`;
      logModalCompleted.checked = !!log.completed;
      logModalMemo.value = log.memo || '';
      logBackdrop.classList.add('open');
    }

    document.getElementById('btn-close-log-modal').onclick = () => logBackdrop.classList.remove('open');
    logBackdrop.onclick = (e) => { if (e.target === logBackdrop) logBackdrop.classList.remove('open'); };

    document.getElementById('btn-save-log-modal').onclick = async () => {
      if (!logModalState) return;
      const logId = `${logModalState.habitId}_${logModalState.date}`;
      const completed = logModalCompleted.checked;
      const memo = logModalMemo.value;
      if (!completed && !memo.trim()) {
        await deleteDoc(doc(db, 'logs', logId));
      } else {
        await setDoc(doc(db, 'logs', logId), { habitId: logModalState.habitId, date: logModalState.date, completed, memo });
      }
      logBackdrop.classList.remove('open');
    };

    // 習慣編集（リネーム＆色変更）モーダル操作
    const editBackdrop = document.getElementById('edit-modal-backdrop');
    const editTitleInput = document.getElementById('edit-habit-title');

    function openEditModal(habit) {
      editingHabitId = habit.id;
      editTitleInput.value = habit.title;
      editSelectedColor = habit.color || COLORS[0];
      renderColorPicker(editColorPickerEl, () => editSelectedColor, (c) => { editSelectedColor = c; });
      editBackdrop.classList.add('open');
      editTitleInput.focus();
    }

    document.getElementById('btn-close-edit-modal').onclick = () => editBackdrop.classList.remove('open');
    editBackdrop.onclick = (e) => { if (e.target === editBackdrop) editBackdrop.classList.remove('open'); };

    document.getElementById('btn-save-edit-modal').onclick = async () => {
      if (!editingHabitId) return;
      const title = editTitleInput.value.trim();
      if (!title) {
        alert('習慣の名前を入力してください。');
        return;
      }
      await updateDoc(doc(db, 'habits', editingHabitId), {
        title,
        color: editSelectedColor
      });
      editBackdrop.classList.remove('open');
      editingHabitId = null;
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
