<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My DotHabit</title>
  <meta name="theme-color" content="#09090b" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .center {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 20px; gap: 12px;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 20px 14px 80px; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; gap: 8px; flex-wrap: wrap;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .range-switch {
      display: inline-flex; background: #18181b; border: 1px solid #27272a;
      border-radius: 8px; padding: 2px;
    }
    .range-btn {
      background: transparent; border: none; color: #a1a1aa;
      padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background-color 0.15s, color 0.15s;
    }
    .range-btn.active { background: #27272a; color: #f4f4f5; }

    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 12px;
    }
    .habit-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }
    .habit-list.range-30 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 480px) {
      .habit-list.range-30 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .habit-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; gap: 6px;
    }
    .habit-meta { min-width: 0; }
    .habit-title {
      font-weight: 600; font-size: 15px; margin-right: 6px;
      word-break: break-word;
    }
    .habit-count { font-size: 11px; color: #a1a1aa; white-space: nowrap; }
    .habit-controls { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

    .dot-grid {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-auto-flow: column;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      width: fit-content;
      max-width: 100%;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 3px; cursor: pointer;
      transition: transform 0.1s;
    }
    .habit-list.range-30 .dot {
      width: 16px; height: 16px; border-radius: 4px;
    }
    .habit-list.range-30 .dot-grid {
      gap: 5px;
    }
    .dot:hover { transform: scale(1.2); }
    .dot.has-memo { outline: 1.5px solid #ffffffaa; outline-offset: -1.5px; }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: #f4f4f5; color: #09090b; border: none; border-radius: 8px;
      padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .btn-check {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1.5px solid; border-radius: 8px; padding: 5px 10px;
      color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap;
    }
    .btn-icon {
      background: transparent; border: none; color: #71717a; cursor: pointer; padding: 5px; font-size: 13px;
    }
    .btn-icon:hover { color: #f4f4f5; }

    .add-form { margin-bottom: 18px; display: none; flex-direction: column; gap: 12px; }
    .add-form.open { display: flex; }
    input[type="text"], textarea {
      width: 100%; background: #09090b; border: 1px solid #3f3f46; border-radius: 8px;
      padding: 10px 12px; color: #fff; font-size: 14px; margin-top: 4px;
    }
    .color-picker { display: flex; gap: 10px; }
    .color-dot {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    }
    .color-dot.selected { border-color: #fff; transform: scale(1.1); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal { width: 100%; max-width: 400px; padding: 16px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="login-view" class="center">
    <h1>My DotHabit</h1>
    <p style="color:#888; margin-bottom:12px;">自分専用の習慣トラッカー</p>
    <button id="btn-login" class="btn-primary">Googleアカウントでログイン</button>
    <p id="auth-error" style="color:#ef4444; font-size:13px;"></p>
  </div>

  <div id="app-view" class="container" style="display:none;">
    <header class="header">
      <h1>My DotHabit</h1>
      <div class="header-actions">
        <div class="range-switch" role="group" aria-label="表示期間">
          <button type="button" class="range-btn" data-days="120">120日</button>
          <button type="button" class="range-btn" data-days="30">30日</button>
        </div>
        <button id="btn-toggle-add" class="btn-primary">＋ 追加</button>
        <button id="btn-logout" class="btn-icon" title="ログアウト">退出</button>
      </div>
    </header>

    <form id="add-form" class="card add-form">
      <input type="text" id="habit-title" placeholder="習慣の名前（例：読書 15分、散歩）" required />
      <div class="color-picker" id="add-color-picker"></div>
      <button type="submit" class="btn-primary" style="width:100%;">作成する</button>
    </form>

    <div id="habit-list" class="habit-list"></div>
  </div>

  <!-- 日付別記録＆メモモーダル -->
  <div id="log-modal-backdrop" class="modal-backdrop">
    <div class="card modal">
      <div class="modal-header">
        <h3 id="log-modal-title"></h3>
        <button id="btn-close-log-modal" class="btn-icon">✕</button>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="log-modal-completed" />
        <span>達成済みにする</span>
      </label>
      <div style="margin-top:12px;">
        <label style="font-size:12px; color:#a1a1aa;">一言メモ</label>
        <textarea id="log-modal-memo" rows="3" placeholder="感想や記録メモ..."></textarea>
      </div>
      <button id="btn-save-log-modal" class="btn-primary" style="width:100%; margin-top:12px;">保存</button>
    </div>
  </div>

  <!-- 習慣編集（リネーム＆色変更）モーダル -->
  <div id="edit-modal-backdrop" class="modal-backdrop">
    <div class="card modal">
      <div class="modal-header">
        <h3>習慣の編集</h3>
        <button id="btn-close-edit-modal" class="btn-icon">✕</button>
      </div>
      <div>
        <label style="font-size:12px; color:#a1a1aa;">習慣の名前</label>
        <input type="text" id="edit-habit-title" required />
      </div>
      <div style="margin-top:12px;">
        <label style="font-size:12px; color:#a1a1aa; display:block; margin-bottom:6px;">テーマカラー</label>
        <div class="color-picker" id="edit-color-picker"></div>
      </div>
      <button id="btn-save-edit-modal" class="btn-primary" style="width:100%; margin-top:14px;">変更を保存</button>
    </div>
  </div>
